services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: tv_tracker_e2e
      POSTGRES_USER: tv_tracker
      POSTGRES_PASSWORD: tv_tracker_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_e2e_data:/var/lib/postgresql/18/docker
    networks:
      - e2e
    command: >
      postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB -c shared_buffers=256MB

  mailpit:
    image: axllent/mailpit:v1.27.0
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - e2e

networks:
  e2e:
    name: tv-tracker-e2e
    driver: bridge

volumes:
  postgres_e2e_data:
