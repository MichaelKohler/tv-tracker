minimumReleaseAge: 1440
strictPeerDependencies: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.2.0
  '@vitest/browser-playwright': 5.0.4
  '@vitest/coverage-v8': 5.0.4
overrides:
  vite: 'catalog:'
  deepmerge-ts: '>=7.1.6'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
shamefullyHoist: true
allowBuilds:
  '@prisma/engines': true
  '@sentry/cli': true
  bcrypt: true
  esbuild: true
  prisma: true
  unrs-resolver: true
